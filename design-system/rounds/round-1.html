<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coolchy Design Review — Round 1 (100 Concepts)</title>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6660; --border:#e7e1d8;
    --like:#3a7d54; --pass:#b5532c; --later:#c9a227;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 24px;}
  h1{margin:0 0 4px;font-size:20px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:12px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select,input[type=text]{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;}
  .stat{font-size:13px;color:var(--muted);}
  button.primary{background:var(--ink);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer;}
  button.primary:hover{opacity:.85;}
  button.ghost{background:transparent;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer;}
  main{max-width:1280px;margin:0 auto;padding:20px 24px 80px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s;}
  .card.decided-like{border-color:var(--like);box-shadow:0 0 0 2px rgba(58,125,84,.15);}
  .card.decided-pass{opacity:.55;}
  .card.decided-later{border-color:var(--later);box-shadow:0 0 0 2px rgba(201,162,39,.15);}
  .palette{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--border);}
  .swatch{flex:1;}
  .idnum{font-size:11px;color:var(--muted);font-weight:600;}
  .cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .title{font-size:15px;font-weight:700;margin:0;}
  .desc{font-size:12.5px;color:#444;line-height:1.4;flex-grow:1;}
  .product{font-size:11px;color:var(--muted);font-style:italic;}
  .decision-row{display:flex;gap:6px;}
  .decision-row button{flex:1;border:1px solid var(--border);background:#fff;border-radius:6px;padding:6px 0;font-size:12px;cursor:pointer;font-weight:600;}
  .decision-row button.like.active{background:var(--like);color:#fff;border-color:var(--like);}
  .decision-row button.pass.active{background:var(--pass);color:#fff;border-color:var(--pass);}
  .decision-row button.later.active{background:var(--later);color:#fff;border-color:var(--later);}
  textarea{width:100%;min-height:44px;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;resize:vertical;font-family:inherit;}
  .hidden{display:none !important;}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;font-size:13px;}
  footer button{background:#fff;color:var(--ink);border:none;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600;}
</style>
</head>
<body>
<header>
  <h1>Coolchy Design Review — Round 1</h1>
  <div class="sub">100 design concepts. Mark each Like / Pass / Later and add notes if you want. Your choices auto-save in this browser. Click "Export Feedback" when done and send the downloaded JSON file back.</div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search title or description...">
    <select id="categoryFilter"><option value="">All categories</option></select>
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="undecided">Undecided</option>
      <option value="like">Liked</option>
      <option value="pass">Passed</option>
      <option value="later">Later</option>
    </select>
    <button class="ghost" id="resetBtn">Reset all decisions</button>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>
  <span class="stat" id="progress">0 / 100 reviewed</span>
  <button id="exportBtn">Export Feedback (.json)</button>
</footer>

id": 99, "category": "Holiday & Seasonal", "title": "Grateful / Blessed / Stuffed", "palette": ["#2E5339", "#9E2B2B", "#F4ECD8", "#C9A227"], "description": "Hand-lettered stacked words in an autumn palette for Thanksgiving.", "product": "Tee / Mug"}, {"id": 100, "category": "Holiday & Seasonal", "title": "Groovy New Year Countdown", "palette": ["#2E5339", "#9E2B2B", "#F4ECD8", "#C9A227"], "description": "Retro groovy typography spelling out a customizable year with confetti accents.", "product": "Tee / Print"}];

const STORAGE_KEY = "coolchy-feedback-" + ROUND_KEY;
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); updateProgress(); }

function updateProgress(){
  const decided = Object.values(state).filter(s => s.decision).length;
  document.getElementById('progress').textContent = `${decided} / ${DATA.length} reviewed`;
}

function cardHTML(item){
  const sw = item.palette.map(c => `<div class="swatch" style="background:${c}"></div>`).join('');
  const s = state[item.id] || {};
  return `
  <div class="card" data-id="${item.id}" data-category="${item.category}">
    <div class="palette">${sw}</div>
    <div class="idnum">#${String(item.id).padStart(3,'0')}</div>
    <div class="cat">${item.category}</div>
    <h3 class="title">${item.title}</h3>
    <div class="desc">${item.description}</div>
    <div class="product">Suggested: ${item.product}</div>
    <div class="decision-row">
      <button class="like ${s.decision==='like'?'active':''}" data-d="like">Like</button>
      <button class="pass ${s.decision==='pass'?'active':''}" data-d="pass">Pass</button>
      <button class="later ${s.decision==='later'?'active':''}" data-d="later">Later</button>
    </div>
    <textarea placeholder="Notes (optional)...">${s.notes || ''}</textarea>
  </div>`;
}

const grid = document.getElementById('grid');
grid.innerHTML = DATA.map(cardHTML).join('');

// category filter options
const cats = [...new Set(DATA.map(d => d.category))];
const catSelect = document.getElementById('categoryFilter');
cats.forEach(c => {
  const o = document.createElement('option'); o.value = c; o.textContent = c; catSelect.appendChild(o);
});

function refreshCardClasses(){
  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    const d = (state[id] || {}).decision;
    card.classList.remove('decided-like','decided-pass','decided-later');
    if(d) card.classList.add('decided-' + d);
  });
}
refreshCardClasses();
updateProgress();

grid.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-d]');
  if(!btn) return;
  const card = btn.closest('.card');
  const id = card.dataset.id;
  const decision = btn.dataset.d;
  state[id] = state[id] || {};
  state[id].decision = (state[id].decision === decision) ? null : decision;
  save();
  refreshCardClasses();
  card.querySelectorAll('.decision-row button').forEach(b => b.classList.remove('active'));
  if(state[id].decision) card.querySelector(`button[data-d="${state[id].decision}"]`).classList.add('active');
});

grid.addEventListener('input', (e) => {
  if(e.target.tagName !== 'TEXTAREA') return;
  const card = e.target.closest('.card');
  const id = card.dataset.id;
  state[id] = state[id] || {};
  state[id].notes = e.target.value;
  save();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if(!confirm('Clear all decisions and notes for this round?')) return;
  state = {};
  save();
  grid.innerHTML = DATA.map(cardHTML).join('');
  refreshCardClasses();
});

function applyFilters(){
  const q = document.getElementById('search').value.toLowerCase();
  const cat = catSelect.value;
  const status = document.getElementById('statusFilter').value;
  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    const item = DATA.find(d => d.id == id);
    const decision = (state[id] || {}).decision || '';
    let show = true;
    if(q && !(item.title.toLowerCase().includes(q) || item.description.toLowerCase().includes(q))) show = false;
    if(cat && item.category !== cat) show = false;
    if(status === 'undecided' && decision) show = false;
    if(status && status !== 'undecided' && decision !== status) show = false;
    card.classList.toggle('hidden', !show);
  });
}
document.getElementById('search').addEventListener('input', applyFilters);
catSelect.addEventListener('change', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);

document.getElementById('exportBtn').addEventListener('click', () => {
  const out = DATA.map(item => ({
    id: item.id,
    title: item.title,
    category: item.category,
    decision: (state[item.id] || {}).decision || null,
    notes: (state[item.id] || {}).notes || ""
  }));
  const blob = new Blob([JSON.stringify({round: ROUND_KEY, feedback: out}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = ROUND_KEY + '-feedback.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
